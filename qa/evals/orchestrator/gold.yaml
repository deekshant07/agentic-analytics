# qa/gold_queries.yaml — Gold-labeled query dataset for Query Understanding eval.
#
# Each entry is a natural-language query + expected orchestrator output.
# The eval scores 5 dimensions per query:
#   intent      → analysis_type
#   metric      → metric_id
#   filters     → filters dict (all keys must match)
#   time_range  → time_range_days OR date_from/date_to
#   ambiguity   → clarify when should_clarify: true
#
# Add more entries to expand coverage — the eval loads this file automatically.
# Dimension fields are all optional; unset fields are skipped in scoring.


# ── GROUP 1: Activation rate ─────────────────────────────────────────────────

- query: "what is activation rate"
  analysis_type: metric
  intent: scalar
  metric_id: activation_rate
  tags: [activation, scalar]

- query: "what is UPI activation rate"
  analysis_type: metric
  intent: scalar
  metric_id: activation_rate
  filters:
    transaction_channel: UPI
  tags: [activation, scalar, filter]

- query: "show activation rate MOM for last 6 months"
  analysis_type: metric
  intent: trend
  metric_id: activation_rate
  time_granularity: month
  time_range_days: 180
  tags: [activation, trend, monthly]

- query: "show activation rate by platform"
  analysis_type: segment
  intent: breakdown
  metric_id: activation_rate
  breakdown: platform
  tags: [activation, breakdown]

- query: "show 48 hour UPI activation"
  analysis_type: metric
  intent: scalar
  metric_id: activation_rate
  filters:
    transaction_channel: UPI
  tags: [activation, filter, hours_window]

- query: "show activation rate for Jan"
  analysis_type: metric
  intent: scalar
  metric_id: activation_rate
  date_from: "2026-01-01"
  date_to: "2026-02-01"
  tags: [activation, calendar_filter]

- query: "what is Android activation rate"
  analysis_type: metric
  intent: scalar
  metric_id: activation_rate
  filters:
    platform: android
  tags: [activation, scalar, filter]

- query: "show activation rate trend last quarter"
  analysis_type: metric
  intent: trend
  metric_id: activation_rate
  time_range_days: 90
  tags: [activation, trend]

- query: "activation rate by city"
  analysis_type: segment
  intent: breakdown
  metric_id: activation_rate
  breakdown: city
  tags: [activation, breakdown]

- query: "show activation rate for savings account users"
  analysis_type: metric
  intent: scalar
  metric_id: activation_rate
  filters:
    account_type: savings
  tags: [activation, filter]

- query: "show activation rate for pro account users"
  analysis_type: metric
  metric_id: activation_rate
  filters:
    account_type: pro
  tags: [activation, filter, filter_precision]

- query: "show activation rate for salary account users"
  analysis_type: metric
  metric_id: activation_rate
  filters:
    account_type: salary
  tags: [activation, filter, filter_precision]

- query: "show activation rate for students"
  analysis_type: metric
  metric_id: activation_rate
  filters:
    occupation: student
  tags: [activation, filter, filter_precision]

- query: "show activation rate for iOS users in Jan"
  analysis_type: metric
  metric_id: activation_rate
  filters:
    platform: ios
  date_from: "2026-01-01"
  date_to: "2026-02-01"
  tags: [activation, filter, filter_precision, calendar_filter]

- query: "show overall activation rate"
  analysis_type: metric
  metric_id: activation_rate
  no_filters: true
  tags: [activation, filter_precision, no_filter]


